# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: agent-framework-agent-with-local-tools-responses
services:
    agent-framework-agent-with-local-tools-responses:
        project: src/agent-framework-agent-with-local-tools-responses
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            ADO_ORG_URL: ${ADO_ORG_URL}
            ADO_PROJECT: ${ADO_PROJECT}
            ADO_PAT: ${ADO_PAT}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: >-
          Knowledge IQ agent that answers questions using Azure DevOps work items and wiki pages
          from https://dev.azure.com/madhurshukla, project Caller.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: knowledge-iq-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 10
                name: GlobalStandard
infra:
    provider: microsoft.foundry
