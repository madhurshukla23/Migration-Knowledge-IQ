# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: echo-activity
services:
    ai-project:
        host: azure.ai.project
        endpoint: https://cog-3y7mapyaibvjm.services.ai.azure.com/api/projects/knowledge-iq-ai
    echo-activity:
        project: src/echo-activity
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        uses:
            - ai-project
        agentEndpoint:
            authorizationSchemes:
                - type: BotServiceRbac
            protocols:
                - activity
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            ADO_ORG_URL: ${ADO_ORG_URL}
            ADO_PROJECT: ${ADO_PROJECT}
            ADO_PAT: ${ADO_PAT}
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            Knowledge IQ Teams agent that answers questions using Azure DevOps work items and wiki pages
            from https://dev.azure.com/madhurshukla, project Caller.
        displayName: Knowledge IQ Teams Bot (Python, Activity)
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Activity Protocol
                - Bring Your Own
                - Python
        name: knowledgeiq-madhur
        protocols:
            - protocol: activity
              version: 2.0.0
infra:
    provider: microsoft.foundry
